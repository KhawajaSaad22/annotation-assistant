services:
  app:
    image: annotation-assistant:cuda-local
    build:
      context: .
      args:
        TORCH_INDEX_URL: https://pypi.org/simple
    gpus: all
    environment:
      INSPECTION_DEVICE: cuda
    command: ["sh", "-c", "python gpu_check.py && python -m streamlit run app.py --server.address=0.0.0.0 --server.port=8501"]

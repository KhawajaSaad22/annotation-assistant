services:
  app:
    image: ghcr.io/khawajasaad22/annotation-assistant:latest
    build: .
    ports:
      - "127.0.0.1:8504:8501"
    environment:
      HF_HOME: /cache/huggingface
    volumes:
      - model-cache:/cache
      - data:/app/data
      - artifacts:/app/artifacts
      - runs:/app/runs
      - annotations:/app/annotations
volumes:
  model-cache:
  data:
  artifacts:
  runs:
  annotations:
